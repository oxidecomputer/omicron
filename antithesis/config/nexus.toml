# TODO-RAINCLAUDE: a fixed seed keeps region allocation ordering deterministic so Antithesis controls the only randomness.
[default_region_allocation_strategy]
type = "random"
seed = 0

[omdb]
bin_path = "/opt/oxide/bin/omdb"
