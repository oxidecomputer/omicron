format_version = 1

[target]
name = "hardware_component"
description = "A hardware component on a compute sled, switch, or power shelf"
authz_scope = "fleet"
versions = [
    { version = 1, fields = [
        "rack_id",
        "slot",
        "chassis_kind",
        "chassis_serial",
        "chassis_model",
        "chassis_revision",
        "hubris_archive_id",
        "gateway_id",
        "component_kind",
        "component_id",
        "description",
        "component_manufacturer",
        "component_model",
        "component_revision",
        "component_serial",
    ]}

[fields.rack_id]
type = "uuid"
description = "ID of the rack on which this measurement was recorded."

[fields.slot]
type = "u32"
description = """
The cubby number or switch slot of the service processor reporting the \
measurement"""

[fields.chassis_model]
type = "string"
description = "Model number of the sled, switch, or power shelf"

[fields.chassis_revision]
type = "u32"
description = "Revision number of the sled, switch, or power shelf"

[fields.chassis_serial]
type = "string"
description = "Serial number of the sled, switch, or power shelf"

[fields.hubris_archive_id]
type = "string"
description = """
Hubris firmware archive ID of the service processor when the measurement \
was recorded."""

[fields.gateway_id]
type = "uuid"
description = """
ID of the Management Gateway Service process which recorded the measurement."""

[fields.chassis_kind]
type = "string"
description = """
What kind of thing the component resides on.

This will be one of 'sled', for components on compute sleds; 'switch', for \
components on rack switches; or 'power', for components on power shelves."""

[fields.component_id]
type = "string"
description = """
The service processor component ID uniquely identifying the hardware \
component on the sled, switch, or power shelf."""

[fields.component_kind]
type = "string"
description = "What type of hardware component this thing is."

[fields.description]
type = "string"
description = """
A human-readable description of the hardware component. This may include \
its location or role in the system (e.g. a DIMM's number, or a temperature \
sensor's location)."""

[fields.sensor]
type = "string"
description = """The name of a sensor that recorded a sensor reading."""

[fields.error]
type = "string"
description = "The kind of sensor error that occurred"

[fields.sensor_kind]
type = "string"
description = """
Which kind of sensor could not be read due to a sensor error.

This will be one of 'temperature', 'current', 'power', 'voltage', \
'input_current', 'input_voltage', 'fan_speed', 'amd_cpu_tctl', 'pwm', \
'input_power', 'output_energy', or 'input_energy' (the same \
names as the metrics emitted by these sensors when they are read \
successfully)."""

[fields.component_manufacturer]
type = "string"
description = """
A string identifying the manufacturer of this hardware component, if this is \
necessary to interpret the component's  identity.

This field is included if and only if the manufacturer identity is necessary \
in order to interpret the component's `component_model`, `component_revision`, \
and `component_serial` fields. If the component does not have those fields, or \
if the component's serial number is assigned by Oxide, this field will be the \
empty string."""

[fields.component_model]
type = "string"
description = """
A string representation of a model number or similar identifier for this \
hardware component, if it has one.

If this field is present and the `component_manufacturer` field is the empty \
string, this field contains the Oxide part number (CPN) for this component. \
Otherwise, if  `component_manufacturer` is present, this is a \
manufacturer-provided part or model number (MPN) for this hardware component."""

[fields.component_revision]
type = "string"
description = """
A string representation of a revision number or string for this hardware \
component, if it is known.

If this field is present and the `component_manufacturer` field is the empty \
string, this field contains the Oxide revision number for this component, \
which is a non-negative integer.  Otherwise, if `component_manufacturer` is \
non-empty, this is a revision identifier assigned by the component's \
manufacturer, and may be any string."""

[fields.component_serial]
type = "string"
description = """
A string representation of this hardware component's serial number, if it is \
known.

If this field is present and the `component_manufacturer` field is the empty \
string, this field contains the Oxide serial number for this component. \
Otherwise, if `component_manufacturer` is non-empty, this is a serial number \
assigned by the component's manufacturer."""

[[metrics]]
name = "temperature"
description = """
A physical temperature reading from a hardware component.

Note that AMD host CPUs report a control temperature (Tctl) value, which is \
*not* a temperature measurement in degrees Celsius, but a dimensionless \
value that represents how close the CPU is to thermal throttling. This value \
is recorded in a separate `hardware_component:amd_cpu_tctl` metric.\
"""
units = "degrees_celsius"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]

[[metrics]]
name = "current"
description = "Output current reading in amperes"
units = "amps"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]

[[metrics]]
name = "power"
description = "Power reading, in watts"
units = "watts"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]

[[metrics]]
name = "voltage"
description = "Output voltage reading, in volts"
units = "volts"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]

[[metrics]]
name = "input_current"
description = "Input electric current reading in amperes"
units = "amps"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]

[[metrics]]
name = "input_voltage"
description = "Input electric voltage reading, in volts"
units = "volts"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]


[[metrics]]
name = "fan_speed"
description = "A fan speed measurement, in rotations per minute"
units = "rpm"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]

[[metrics]]
name = "sensor_error_count"
description = "Cumulative count of errors reported by a sensor"
units = "count"
datum_type = "cumulative_u64"
versions = [
    { added_in = 1, fields = ["sensor", "error", "sensor_kind"]}
]

[[metrics]]
name = "poll_error_count"
description = """
Cumulative count of errors encountered whilst polling a component's sensors.

Unlike the `sensor_error_count` metric, this counts errors encountered by \
the management gateway while polling the component, rather than errors \
reported by the component itself."""
units = "count"
datum_type = "cumulative_u64"
versions = [
    { added_in = 1, fields = ["error"] }
]

[[metrics]]
name = "amd_cpu_tctl"
description = """
A CPU Tctl (control temperature) reading from an AMD CPU.

Note that, unlike other temperature metrics, this is not a measurement of \
temperature in degrees Celsius or Fahrenheit, but is instead a dimensionless \
quantity used by the processor's thermal control loop. This value has two \
notable thresholds:

1. At a value of 95, the CPU will begin internal thermal throttling.
2. At a value of 100, the CPU will shut down."""
units = "none"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]

[[metrics]]
name = "pwm"
description = """
PWM duty cycle normalized to the 0.0-1.0 range.
"""
units = "none"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]

[[metrics]]
name = "input_power"
description = """
Input power.
"""
units = "watts"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]

[[metrics]]
name = "output_energy"
description = """
Sampled output energy.
"""
units = "joules"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]

[[metrics]]
name = "input_energy"
description = """
Sampled input energy.
"""
units = "joules"
datum_type = "f32"
versions = [
    { added_in = 1, fields = ["sensor"]}
]
