format_version = 1

[target]
name = "silo_quota"
description = "Silo quota capacity and provisioned resources"
authz_scope = "fleet"
versions = [
    { version = 1, fields = [ "nexus_id", "silo_id" ] },
]

[fields.nexus_id]
type = "uuid"
description = "ID of the Nexus reporting the sample"

[fields.silo_id]
type = "uuid"
description = "ID of the silo"

[[metrics]]
name = "memory_capacity"
description = "Quota limit for provisioned memory"
units = "bytes"
datum_type = "u64"
versions = [
    { added_in = 1, fields = [] }
]

[[metrics]]
name = "memory_provisioned"
description = "Provisioned memory charged against the quota"
units = "bytes"
datum_type = "u64"
versions = [
    { added_in = 1, fields = [] }
]

[[metrics]]
name = "cpu_capacity"
description = "Quota limit for provisioned vCPUs"
units = "count"
datum_type = "u64"
versions = [
    { added_in = 1, fields = [] }
]

[[metrics]]
name = "cpu_provisioned"
description = "Provisioned vCPUs charged against the quota"
units = "count"
datum_type = "u64"
versions = [
    { added_in = 1, fields = [] }
]

[[metrics]]
name = "disk_capacity"
description = "Quota limit for provisioned disk and snapshot storage"
units = "bytes"
datum_type = "u64"
versions = [
    { added_in = 1, fields = [] }
]

[[metrics]]
name = "disk_provisioned"
description = "Provisioned disk charged against the quota"
units = "bytes"
datum_type = "u64"
versions = [
    { added_in = 1, fields = [] }
]
