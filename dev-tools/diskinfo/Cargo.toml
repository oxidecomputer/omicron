[package]
name = "diskinfo"
description = "Print an inventory of a sled's NVMe disks as JSON"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
omicron-workspace-hack.workspace = true

[target.'cfg(target_os = "illumos")'.dependencies]
illumos-devinfo = { git = "https://github.com/oxidecomputer/illumos-devinfo", branch = "main" }
kstat-rs.workspace = true
libefi-illumos = { git = "https://github.com/oxidecomputer/libefi-illumos", branch = "master" }
libnvme = { workspace = true, features = ["serde"] }
libtopo = { git = "https://github.com/oxidecomputer/libtopo", rev = "95bdbf9a36f5f94890299abfea243c5dd313f390" }

[[bin]]
name = "diskinfo"
