[package]
name = "nexus-fm-preparation"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[build-dependencies]
omicron-rpaths.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dropshot.workspace = true # for pagination order
iddqd.workspace = true
nexus-types.workspace = true
nexus-fm.workspace = true
nexus-db-queries.workspace = true
omicron-certificates.workspace = true
omicron-common.workspace = true
omicron-generation-kinds.workspace = true
omicron-uuid-kinds.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
slog.workspace = true
slog-error-chain.workspace = true
steno.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio-util = { workspace = true, features = ["rt", "join-map"]}
uuid.workspace = true

# See omicron-rpaths for more about the "pq-sys" dependency. This is needed
# because we use the database in the test suite, though it doesn't appear to
# work to put the pq-sys dependency only in dev-dependencies.
pq-sys = "*"

omicron-workspace-hack.workspace = true

[target.'cfg(target_os = "illumos")'.dependencies]
# See omicron-rpaths for more about the "fmd-adm-sys" dependency.
fmd-adm-sys.workspace = true

[dev-dependencies]
async-bb8-diesel.workspace = true
diesel.workspace = true
nexus-db-model.workspace = true
nexus-db-queries = { workspace = true, features = ["testing"] }
nexus-db-schema.workspace = true
nexus-inventory.workspace = true
# Not used directly, but makes this crate an `rdeps(nexus-test-utils)`, which is
# what makes `.config/nextest.toml` decide to run the `crdb-seed` setup script
# that `TestDatabase` relies on.
nexus-test-utils.workspace = true
omicron-test-utils.workspace = true
openssl.workspace = true
rcgen.workspace = true
tokio = { workspace = true, features = ["full"] }
