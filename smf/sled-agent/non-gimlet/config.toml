# Sled Agent configuration - generated by voxel (g0).

sled_mode = "scrimlet"
sidecar_revision.soft_propolis = { front_port_count = 2, rear_port_count = 4 }
skip_timesync = false

external_disks = { kind = "hardcoded", vdevs = ["m2_g0_0.vdev", "m2_g0_1.vdev", "u2_g0_0.vdev", "u2_g0_1.vdev", "u2_g0_2.vdev", "u2_g0_3.vdev", "u2_g0_4.vdev"], disks = [] }

vmm_reservoir_percentage = 0

data_link = "vioif1"

switch_zone_maghemite_links = [
    "tfportrear0_0",
    "tfportrear1_0",
    "tfportrear2_0",
    "tfportrear3_0",
]

data_links = { kind = "virtual", devices = ["vioif1", "vioif2"] }

[dropshot]
default_request_body_max_bytes = 1048576

[log]
level = "info"
mode = "file"
path = "/dev/stdout"
if_exists = "append"

[sprockets]
resolve = { which = "local", priv_key = "/opt/cargo-bay/sprockets/test-sprockets-auth-0.key.pem", cert_chain = "/opt/cargo-bay/sprockets/test-sprockets-auth-0.certlist.pem" }
attest = { which = "local", priv_key = "/opt/cargo-bay/sprockets/test-alias-0.key.pem", cert_chain = "/opt/cargo-bay/sprockets/test-alias-0.certlist.pem", log = "/opt/cargo-bay/sprockets/test-sprockets-log.bin", test_corpus = [ "/opt/cargo-bay/sprockets/test-measurements.corim" ] }
roots = ["/opt/cargo-bay/sprockets/test-root-a.cert.pem"]
