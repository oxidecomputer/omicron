#
# Build private documentation for this package to serve as internal developer
# documentation.  (The "library" in this package only exists to implement the
# binaries and the test suite.  There's no need for typical library
# documentation of public interfaces.)
#
# NOTE: If you change this, also change the `RUSTDOCFLAGS` values in the various
# CI scripts:
# - .github/buildomat/build-and-test.sh
# - .github/buildomat/jobs/clippy.sh
# - .github/buildomat/jobs/check-features.sh
# - .github/workflows/rust.yml
#
# WARNING: If you're setting `RUSTFLAGS` in a global `~/.cargo/config.toml`, or
# as an environment variable in your shell, this will CONFLICT WITH THE
# CONFIGURATION HERE, as `build.rustflags` configuration is NOT ADDITIVE.
# This is particularly relevant for folks using the `mold` linker via
# `RUSTFLAGS`. `mold` users should consider using `mold -run cargo` instead, as
# described here: https://github.com/rui314/mold#how-to-use
[build]
rustdocflags = "--document-private-items"
rustflags = "--cfg tokio_unstable"

# On illumos, use `-znocompstrtab` to reduce link time. We also add two
# directories to the RPATH where libraries outside the default search path
# live:
#
# - /usr/platform/oxide/lib/amd64 holds Oxide-specific libraries such as
#   libipcc, and will likely grow over time to include more functionality.
# - /usr/lib/fm/amd64 holds the illumos fault management libraries such as
#   libtopo, which sled-hardware uses to find each disk's chassis location.
#
# Our reasoning for putting these here rather than going through the rpaths
# crate:
# - Static, illumos-only paths - The rpaths crate was built to deal with
#   runtime paths that are dynamic such as with libraries like libpq which can
#   live in different locations based on OS. These paths will only ever be
#   found on illumos and never move.
# - Less developer burden - Having a -sys crate emit `DEP_*_LIBDIRS` means that
#   we end up littering the repo with Cargo.toml and build.rs changes in every
#   crate whose binaries or tests transitively link the library. For libipcc
#   that was already painful; libtopo enters through sled-hardware, which well
#   over a hundred workspace crates reach transitively. While initially
#   exploring that path for libipcc we ran into a significant number of tests
#   failing due to not being able to find the library in the runtime path,
#   which can be confusing or surprising to someone doing work on omicron.
#
# We could also update Helios so that symlinks are created from these
# directories into /usr/lib/64 but we opted to not take this route forward as
# it meant waiting for another round of updates on shared build machines and
# to buildomat itself.
#
# As documented at:
# https://doc.rust-lang.org/cargo/reference/config.html#buildrustflags
#
# There are four mutually exclusive sources of extra flags. They are checked in
# order, with the first one being used:
#   1. `CARGO_ENCODED_RUSTFLAGS` environment variable.
#   2. `RUSTFLAGS` environment variable.
#   3. All matching target.<triple>.rustflags and target.<cfg>.rustflags config
#      entries joined together.
#   4. build.rustflags config value.
#
# When overriding the defaults in this config by environment variable the user
# may need to manually pass the additional options found below.
#
# Runtime paths for illumos-only libraries with a fixed install location, like
# the two above, belong here. Runtime paths for cross-platform libraries should
# not be added here, but should instead reuse the infrastructure found in the
# `rpaths` crate in this repo. Those paths are usually platform specific and
# will vary based on a variety of things such as host OS. Whatever is added
# here must also be added to the `RUSTFLAGS` override in
# .github/buildomat/build-and-test.sh, which takes precedence over this file.
[target.x86_64-unknown-illumos]
rustflags = [
    "-C", "link-arg=-Wl,-znocompstrtab,-R/usr/platform/oxide/lib/amd64:/usr/lib/fm/amd64",
    # enable the `tokio-unstable` config for `tokio-dtrace` probes
    "--cfg", "tokio_unstable"
]

# Set up `cargo xtask`.
[alias]
xtask = "run --package xtask -- "
